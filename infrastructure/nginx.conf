worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 512M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Use Docker's embedded DNS so upstream hostnames are resolved at request
    # time instead of once at startup. This prevents "host not found in upstream"
    # errors when backend or frontend containers are not yet available when nginx
    # first starts.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name localhost;

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        location /redoc {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }
    }
}